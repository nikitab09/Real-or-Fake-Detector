<!DOCTYPE html>
<html>

<head>
    <title>AI Fake Image Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.70);
            padding: 30px;
            width: 100%;
            max-width: 460px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }

        input[type="file"] {
            margin: 15px 0;
            width: 100%;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background: #5a67d8;
            transform: scale(1.03);
        }

        img {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 12px;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: #667eea;
        }

        /* Confidence Bar */
        .confidence-container {
            margin-top: 20px;
        }

        .confidence-label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 25px;
            overflow: hidden;
            height: 14px;
            margin-top: 8px;
        }

        .progress {
            height: 12px;
            width: 0%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            transition: width 0.8s ease-in-out;
        }

        /* Reset Button */
        .reset-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #ff5f6d, #ff2e63);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }

            button {
                font-size: 15px;
            }
        }
    </style>

    <script>
        function showLoading() {
            document.getElementById("loading").style.display = "block";
        }
    </script>
</head>

<body>

    <div class="card">
        <h2>AI Fake Image Detector</h2>

        <form method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
            <input type="file" name="file" required>
            <br>
            <button type="submit">Analyze Image</button>
        </form>

        <div id="loading" class="loading">
            Analyzing image...
        </div>

        {% if image_path %}
        <img src="{{ url_for('static', filename=image_path) }}">
        {% endif %}

        {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>

        <!-- Confidence Bar -->
        <div class="confidence-container">
            <div class="confidence-label">Confidence</div>
            <div class="progress-bar">
                <div class="progress" style="width: {{ (confidence | default(0)) * 100 }}%;"></div>
            </div>
            <p>{{ ((confidence | default(0)) * 100) | round(2) }}%</p>
        </div>

        <!-- Reset Button -->
        <a href="/reset">
            <button type="button" class="reset-btn">
                Reset
            </button>
        </a>
        {% endif %}

    </div>

</body>

</html>
